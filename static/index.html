<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sòng Bạc Online</title>
    <style>
      :root {
        --bg: #0b1020;
        --panel: #121a2a;
        --panel-2: #1a2440;
        --gold: #f7c948;
        --green: #3ddc97;
        --red: #ff6b6b;
        --text: #edf2ff;
        --muted: #a8b3cf;
        --border: rgba(255,255,255,0.08);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #0b1020, #111827 45%, #1d2433);
        color: var(--text);
      }

      .container { max-width: 1200px; margin: 32px auto; padding: 24px; }
      .header {
        display: flex; justify-content: space-between; align-items: center;
        margin-bottom: 24px; gap: 20px;
      }
      .brand { font-size: 2.2rem; font-weight: bold; letter-spacing: 1px; }
      .brand span { color: var(--gold); }
      .user-badge { display: flex; align-items: center; gap: 12px; }
      .user-pill {
        background: rgba(255,255,255,0.06); border: 1px solid var(--border);
        border-radius: 999px; padding: 10px 14px; color: var(--text);
      }
      .grid { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 24px; }
      .card {
        background: rgba(18, 26, 42, 0.96); border: 1px solid var(--border);
        border-radius: 18px; padding: 20px; box-shadow: 0 18px 50px rgba(0,0,0,0.22);
      }
      .panel-title { margin: 0 0 16px; font-size: 1.15rem; color: var(--gold); }
      .row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
      input, select, button {
        padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); font-size: 1rem;
      }
      input, select { background: #0f172a; color: var(--text); }
      button {
        background: linear-gradient(135deg, #f7c948, #f59e0b); color: #111827; font-weight: bold;
        cursor: pointer; border: none; transition: transform 0.15s ease;
      }
      button:hover { transform: translateY(-1px); }
      .primary { background: linear-gradient(135deg, #34d399, #10b981); color: #04130d; }
      .secondary { background: linear-gradient(135deg, #60a5fa, #2563eb); color: white; }
      .ghost { background: rgba(255,255,255,0.06); color: var(--text); border: 1px solid var(--border); }
      .warning { background: linear-gradient(135deg, #fbbf24, #f97316); color: #1f2937; }
      .auth-shell {
        max-width: 560px; margin: 40px auto; background: rgba(18,26,42,0.96);
        border: 1px solid var(--border); border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.25);
        padding: 24px;
      }
      .auth-tabs { display: flex; gap: 10px; margin-bottom: 18px; }
      .tab-btn {
        flex: 1; padding: 12px; border-radius: 10px; border: 1px solid var(--border); cursor: pointer;
        background: rgba(255,255,255,0.03); color: var(--text); font-weight: bold;
      }
      .tab-btn.active {
        background: linear-gradient(135deg, #f7c948, #f59e0b); color: #111827; border-color: transparent;
      }
      .auth-form { display: flex; flex-direction: column; gap: 12px; }
      .auth-form input { width: 100%; }
      .status { min-height: 24px; color: #dff9e7; margin-top: 10px; }
      .hidden { display: none !important; }
      .stat-row { display: grid; grid-template-columns: repeat(3, minmax(100px, 1fr)); gap: 12px; margin-bottom: 20px; }
      .stat-box { background: var(--panel-2); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
      .stat-box small { color: var(--muted); display: block; }
      .stat-box strong { display: block; font-size: 1.25rem; margin-top: 8px; }
      .result { min-height: 180px; background: #07101d; border-radius: 12px; border: 1px solid var(--border); padding: 16px; white-space: pre-wrap; color: #dfe8ff; }
      .list { list-style: none; padding: 0; margin: 0; }
      .list li { padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; background: rgba(255,255,255,0.02); }
      .muted { color: var(--muted); }
      @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } .header { flex-direction: column; align-items: flex-start; } }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="authScreen" class="auth-shell">
        <div class="brand" style="margin-bottom: 18px;"><span>SÒNG</span> BẠC</div>
        <div class="auth-tabs">
          <button class="tab-btn active" type="button" data-mode="login">Đăng nhập</button>
          <button class="tab-btn" type="button" data-mode="signup">Đăng ký</button>
        </div>

        <form id="loginForm" class="auth-form">
          <input id="loginEmail" type="email" placeholder="Email" required />
          <input id="loginPassword" type="password" placeholder="Mật khẩu" required />
          <button type="submit" class="primary">Đăng nhập</button>
          <button type="button" class="ghost" id="googleBtn">Đăng nhập bằng Google</button>
        </form>

        <form id="signupForm" class="auth-form hidden">
          <input id="signupName" type="text" placeholder="Tên của bạn" required />
          <input id="signupEmail" type="email" placeholder="Email" required />
          <input id="signupPassword" type="password" placeholder="Mật khẩu" required />
          <button type="submit" class="primary">Tạo tài khoản</button>
          <button type="button" class="ghost" id="googleSignupBtn">Tiếp tục với Google</button>
        </form>

        <div id="authStatus" class="status"></div>
      </div>

      <div id="appScreen" class="hidden">
        <div class="header">
          <div class="brand"><span>SÒNG</span> BẠC</div>
          <div class="user-badge">
            <span id="userLabel" class="user-pill">Người chơi</span>
            <button id="logoutBtn" class="ghost" type="button">Đăng xuất</button>
          </div>
        </div>

        <div class="grid">
          <div class="card">
            <h2 class="panel-title">Tạo hồ sơ và chơi</h2>
            <div class="row">
              <input id="name" type="text" placeholder="Tên người chơi" style="flex: 1; min-width: 180px;" />
              <button id="createProfile" class="primary">Tạo hồ sơ</button>
            </div>

            <div class="row">
              <select id="profileSelect" style="flex: 1; min-width: 180px;"></select>
              <select id="choice">
                <option value="t">Tài</option>
                <option value="x">Xỉu</option>
              </select>
              <input id="bet" type="number" min="1" value="20" style="width: 110px;" />
              <select id="betType">
                <option value="custom">Cược tùy chọn</option>
                <option value="half">Nửa</option>
                <option value="all">All-in</option>
              </select>
              <button id="playBtn" class="secondary">Chơi</button>
            </div>

            <div class="stat-row">
              <div class="stat-box">
                <small>Hồ sơ</small>
                <strong id="profileCount">0</strong>
              </div>
              <div class="stat-box">
                <small>Top tiền</small>
                <strong id="topBalance">0K</strong>
              </div>
              <div class="stat-box">
                <small>Top winrate</small>
                <strong id="topWinrate">0%</strong>
              </div>
            </div>

            <div class="result" id="resultBox">Chưa có dữ liệu. Hãy tạo hồ sơ và bắt đầu chơi.</div>
          </div>

          <div>
            <div class="card" style="margin-bottom: 24px;">
              <h3 class="panel-title">Bảng xếp hạng</h3>
              <ul id="leaderboardList" class="list"></ul>
            </div>

            <div class="card">
              <h3 class="panel-title">Lịch sử</h3>
              <ul id="historyList" class="list"></ul>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const authScreen = document.getElementById('authScreen');
      const appScreen = document.getElementById('appScreen');
      const authStatus = document.getElementById('authStatus');
      const resultBox = document.getElementById('resultBox');
      const profileSelect = document.getElementById('profileSelect');
      const leaderboardList = document.getElementById('leaderboardList');
      const historyList = document.getElementById('historyList');
      const userLabel = document.getElementById('userLabel');
      const loginForm = document.getElementById('loginForm');
      const signupForm = document.getElementById('signupForm');

      function getStoredUser() {
        const raw = localStorage.getItem('songbac_user');
        if (!raw) return null;
        try {
          return JSON.parse(raw);
        } catch {
          return null;
        }
      }

      function setStoredUser(user) {
        if (!user) {
          localStorage.removeItem('songbac_user');
          return;
        }
        localStorage.setItem('songbac_user', JSON.stringify(user));
      }

      function showAuth() {
        authScreen.classList.remove('hidden');
        appScreen.classList.add('hidden');
      }

      function showApp(user) {
        authScreen.classList.add('hidden');
        appScreen.classList.remove('hidden');
        userLabel.textContent = `${user.name} (${user.email})`;
      }

      function authMessage(message, isError = false) {
        authStatus.textContent = message;
        authStatus.style.color = isError ? '#ffb4b4' : '#dff9e7';
      }

      async function apiFetch(url, options = {}) {
        const user = getStoredUser();
        const headers = { ...(options.headers || {}) };
        if (user?.email) {
          headers['x-user-email'] = user.email;
        }
        if (!(options.body instanceof FormData) && !headers['Content-Type']) {
          headers['Content-Type'] = 'application/json';
        }

        return fetch(url, { ...options, headers });
      }

      function setActiveTab(mode) {
        document.querySelectorAll('.tab-btn').forEach((btn) => {
          btn.classList.toggle('active', btn.dataset.mode === mode);
        });
        const loginVisible = mode === 'login';
        loginForm.classList.toggle('hidden', !loginVisible);
        signupForm.classList.toggle('hidden', loginVisible);
      }

      async function loadProfiles() {
        const res = await apiFetch('/api/profiles');
        if (res.status === 401) {
          logout();
          return;
        }

        const data = await res.json();
        const list = data.profiles || {};
        profileSelect.innerHTML = '';

        Object.keys(list).forEach((name) => {
          const option = document.createElement('option');
          option.value = name;
          option.textContent = name;
          profileSelect.appendChild(option);
        });

        document.getElementById('profileCount').textContent = Object.keys(list).length;
        const top = Object.values(list).slice().sort((a, b) => b.balance - a.balance)[0];
        if (top) {
          document.getElementById('topBalance').textContent = `${top.balance}K`;
        }

        await loadLeaderboard();
        await loadHistory();
      }

      async function loadLeaderboard() {
        const res = await apiFetch('/api/leaderboard');
        if (res.status === 401) {
          logout();
          return;
        }
        const data = await res.json();
        const rows = data.leaderboard || [];
        leaderboardList.innerHTML = '';

        rows.forEach((player, index) => {
          const li = document.createElement('li');
          li.innerHTML = `<strong>#${index + 1} ${player.name}</strong><br><span class="muted">Số dư: ${player.balance}K • Winrate: ${player.winrate}% • Thắng lớn: ${player.biggest_win}K</span>`;
          leaderboardList.appendChild(li);
        });

        if (rows[0]) {
          document.getElementById('topWinrate').textContent = `${rows[0].winrate}%`;
        }
      }

      async function loadHistory() {
        const res = await apiFetch('/api/history');
        if (res.status === 401) {
          logout();
          return;
        }
        const data = await res.json();
        const items = data.history || [];
        historyList.innerHTML = '';

        items.slice(0, 8).forEach((player) => {
          const li = document.createElement('li');
          li.innerHTML = `<strong>${player.name}</strong><br><span class="muted">Ván: ${player.rounds} • Thắng: ${player.wins} • Thua: ${player.losses} • Số dư: ${player.balance}K</span>`;
          historyList.appendChild(li);
        });
      }

      document.querySelectorAll('.tab-btn').forEach((btn) => {
        btn.addEventListener('click', () => setActiveTab(btn.dataset.mode));
      });

      loginForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value.trim();

        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (!res.ok) {
          authMessage(data.detail || 'Đăng nhập thất bại', true);
          return;
        }

        setStoredUser(data.user);
        authMessage('Đăng nhập thành công.');
        showApp(data.user);
        await loadProfiles();
      });

      signupForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const name = document.getElementById('signupName').value.trim();
        const email = document.getElementById('signupEmail').value.trim();
        const password = document.getElementById('signupPassword').value.trim();

        const res = await fetch('/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });
        const data = await res.json();

        if (!res.ok) {
          authMessage(data.detail || 'Tạo tài khoản thất bại', true);
          return;
        }

        authMessage('Tạo tài khoản thành công, hãy đăng nhập.');
        setActiveTab('login');
        document.getElementById('loginEmail').value = email;
        document.getElementById('loginPassword').value = password;
      });

      document.getElementById('googleBtn').addEventListener('click', () => {
        window.location.href = '/auth/google/login';
      });

      document.getElementById('googleSignupBtn').addEventListener('click', () => {
        window.location.href = '/auth/google/login';
      });

      document.getElementById('logoutBtn').addEventListener('click', () => {
        logout();
      });

      function logout() {
        setStoredUser(null);
        showAuth();
        authMessage('Bạn đã đăng xuất.');
        loginForm.reset();
        signupForm.reset();
      }

      document.getElementById('createProfile').addEventListener('click', async () => {
        const name = document.getElementById('name').value.trim();
        if (!name) {
          resultBox.textContent = 'Vui lòng nhập tên người chơi.';
          return;
        }

        const res = await apiFetch('/api/profiles', {
          method: 'POST',
          body: JSON.stringify({ name })
        });

        const data = await res.json();
        if (!res.ok) {
          resultBox.textContent = data.detail || 'Không thể tạo hồ sơ.';
          return;
        }

        resultBox.textContent = `Tạo hồ sơ thành công cho ${data.profile.name}.`;
        document.getElementById('name').value = '';
        await loadProfiles();
        profileSelect.value = data.profile.name;
      });

      document.getElementById('playBtn').addEventListener('click', async () => {
        const profileName = profileSelect.value;
        const choice = document.getElementById('choice').value;
        const bet = Number(document.getElementById('bet').value || 0);
        const betType = document.getElementById('betType').value;

        if (!profileName) {
          resultBox.textContent = 'Vui lòng tạo hoặc chọn hồ sơ trước.';
          return;
        }

        const res = await apiFetch('/api/play', {
          method: 'POST',
          body: JSON.stringify({ profile_name: profileName, choice, bet, bet_type: betType })
        });

        const data = await res.json();
        if (!res.ok) {
          resultBox.textContent = data.detail || 'Có lỗi khi chơi.';
          return;
        }

        resultBox.textContent = `Kết quả: ${data.result.toUpperCase()} | Cược ${data.bet}K | Payout ${data.payout}K | Số dư ${data.balance}K | ${data.bonus_message || 'Không có bonus'}`;
        await loadProfiles();
      });

      const params = new URLSearchParams(window.location.search);
      const googleEmail = params.get('email');
      const googleName = params.get('name');
      if (params.get('google_auth') === '1' && googleEmail) {
        setStoredUser({ email: googleEmail, name: googleName || googleEmail.split('@')[0] });
        window.history.replaceState({}, '', '/');
      }

      const storedUser = getStoredUser();
      if (storedUser) {
        showApp(storedUser);
        loadProfiles();
      } else {
        showAuth();
      }
    </script>
  </body>
</html>
